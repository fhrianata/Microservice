name: microservices-pbl


x-app-common: &app-common
  networks: [microservices-net]
  restart: unless-stopped
  environment: &app-common-env
    EUREKA_URI: http://eureka:8761/eureka/
    LOGSTASH_HOST: logstash
    JAVA_OPTS: "-Xms128m -Xmx256m"

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUKTUR: database & message broker
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    networks: [microservices-net]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auth_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    networks: [microservices-net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ari}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-12345}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m

  # ---------------------------------------------------------------------------
  # SERVICE REGISTRY
  # ---------------------------------------------------------------------------
  eureka:
    <<: *app-common
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: eureka
    hostname: eureka
    environment:
      <<: *app-common-env
    ports:
      - "8761:8761"
    mem_limit: 384m

  # ---------------------------------------------------------------------------
  # API GATEWAY
  # ---------------------------------------------------------------------------
  gateway-service:
    <<: *app-common
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    hostname: gateway-service
    environment:
      <<: *app-common-env
    ports:
      - "9000:9000"
    depends_on:
      eureka:
        condition: service_healthy
    mem_limit: 384m

  # ---------------------------------------------------------------------------
  # BUSINESS SERVICES
  # ---------------------------------------------------------------------------
  authservice:
    <<: *app-common
    build:
      context: ./authservice
      dockerfile: Dockerfile
    container_name: authservice
    hostname: authservice
    environment:
      <<: *app-common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-auth_db}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8086:8086"
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    mem_limit: 384m

  produk:
    <<: *app-common
    build:
      context: ./produk
      dockerfile: Dockerfile
    container_name: produk
    hostname: produk
    environment:
      <<: *app-common-env
    ports:
      - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
    mem_limit: 384m

  pelanggan:
    <<: *app-common
    build:
      context: ./pelanggan
      dockerfile: Dockerfile
    container_name: pelanggan
    hostname: pelanggan
    environment:
      <<: *app-common-env
    ports:
      - "8082:8082"
    depends_on:
      eureka:
        condition: service_healthy
    mem_limit: 384m

  order:
    <<: *app-common
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: order
    hostname: order
    environment:
      <<: *app-common-env
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-ari}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-12345}
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 384m

  produser:
    <<: *app-common
    build:
      context: ./produser
      dockerfile: Dockerfile
    container_name: produser
    hostname: produser
    environment:
      <<: *app-common-env
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-ari}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-12345}
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 384m

  consumer:
    <<: *app-common
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: consumer
    hostname: consumer
    environment:
      <<: *app-common-env
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-ari}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-12345}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_TO: ${APP_MAIL_TO:-fachrianata123@gmail.com}
    ports:
      - "8085:8085"
    depends_on:
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 384m

  # ---------------------------------------------------------------------------
  # MONITORING: Prometheus + Grafana
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks: [microservices-net]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - eureka
      - gateway-service
      - authservice
      - produk
      - pelanggan
      - order
      - produser
      - consumer
    mem_limit: 256m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks: [microservices-net]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    mem_limit: 256m

  # ---------------------------------------------------------------------------
  # ELK (opsional, --profile elk) untuk pencarian log terpusat
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["elk"]
    container_name: elasticsearch
    restart: unless-stopped
    networks: [microservices-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    mem_limit: 600m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: ["elk"]
    container_name: logstash
    restart: unless-stopped
    networks: [microservices-net]
    volumes:
      - ./monitoring/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./monitoring/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - LS_JAVA_OPTS=-Xms128m -Xmx192m
    ports:
      - "5000:5000"
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 256m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["elk"]
    container_name: kibana
    restart: unless-stopped
    networks: [microservices-net]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 256m

networks:
  microservices-net:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  es-data:
