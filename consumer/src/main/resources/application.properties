server.port = 8085
spring.application.name=consumer
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:ari}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:12345}

# --- Kredensial email TIDAK LAGI di-hardcode di sini (sebelumnya ada
# username + app-password Gmail asli tertulis langsung di file ini --
# itu bocor kredensial dan HARUS di-revoke di myaccount.google.com/apppasswords
# kalau belum). Sekarang wajib diisi lewat environment variable
# SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD (lihat .env / docker-compose.yml).
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Alamat tujuan notifikasi email juga dibuat bisa dikonfigurasi
app.mail.to=${APP_MAIL_TO:fachrianata123@gmail.com}

# --- Eureka: supaya consumer terdaftar dan terlihat di dashboard Eureka ---
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# --- Monitoring: expose actuator + Prometheus metrics endpoint ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
