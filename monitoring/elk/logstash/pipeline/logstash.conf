input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Tidak ada transformasi khusus -- field "service" sudah otomatis
  # tertempel di tiap baris log lewat customFields di logback-spring.xml
  # tiap service (lihat: authservice/src/main/resources/logback-spring.xml, dst)
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-%{[service]}-%{+YYYY.MM.dd}"
  }
  # Aktifkan baris di bawah kalau mau lihat log mentah di terminal Logstash saat debugging
  # stdout { codec => rubydebug }
}
