server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUK
              uri: lb://PRODUK
              predicates:
                - Path=/api/produk/**
            - id: PELANGGAN
              uri: lb://PELANGGAN
              predicates:
                - Path=/api/pelanggan/**
            - id: ORDER-SERVICE
              uri: lb://ORDER
              predicates:
                - Path=/api/order/**
            - id: AUTHSERVICE
              uri: lb://AUTHSERVICE
              predicates:
                - Path=/api/auth/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# --- Monitoring: expose actuator + Prometheus metrics endpoint ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true